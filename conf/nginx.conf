#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # The domain vhost applies ssowat at server level with access_by_lua_file.
  # This app declares sso = false: it authenticates itself (local/LDAP form),
  # and ssowat forwards identity as HTTP Basic, which Open WebUI does not
  # consume. Without clearing the inherited access phase, /api/config is
  # answered without the app's own session cookie and therefore never returns
  # its authenticated block - which is where features.enable_web_search lives,
  # so the web search control can never appear in the chat input.
  access_by_lua_block { }

  # nginx's default client_max_body_size is 1m, which rejects phone photos
  # (2-25 MB) with an HTML 413 page. The Open WebUI frontend then does
  # `throw await res.json()` on that HTML, so the user sees WebKit's raw
  # JSON-parsing error ("The string did not match the expected pattern")
  # instead of a real error. 100M matches RAG_FILE_MAX_SIZE in conf/.env.
  client_max_body_size 100M;

  proxy_pass        http://127.0.0.1:__PORT__/;
  proxy_redirect    off;
  proxy_set_header  Host $host;
  proxy_set_header  X-Real-IP $remote_addr;
  proxy_set_header  X-Forwarded-Proto $scheme;
  proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header  X-Forwarded-Host $server_name;

  proxy_http_version 1.1;
  proxy_set_header Connection "upgrade";
  proxy_set_header Upgrade $http_upgrade;
}
